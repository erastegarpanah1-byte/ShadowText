name: ShadowText CI/CD

on:
  push:
    branches: [ main, develop, new-ui ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.5'

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run lint
        run: gradle lint --no-daemon --stacktrace

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign & verify release APK
        if: github.event_name != 'pull_request' && secrets.MYKEYSTORE_BASE64 != ''
        env:
          MYKEYSTORE_BASE64: ${{ secrets.MYKEYSTORE_BASE64 }}
          MYKEYSTORE_PASSWORD: ${{ secrets.MYKEYSTORE_PASSWORD }}
          MYKEY_ALIAS: ${{ secrets.MYKEY_ALIAS }}
          MYKEY_PASSWORD: ${{ secrets.MYKEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          FINAL="app/build/outputs/apk/release/app-release.apk"
          KS="$RUNNER_TEMP/release.jks"

          # Decode keystore from secret
          echo "$MYKEYSTORE_BASE64" | base64 --decode > "$KS"

          # zipalign
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" -v -p 4 "$APK" "$ALIGNED"

          # Sign with apksigner (keystore + passwords from command line args)
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:$MYKEYSTORE_PASSWORD" \
            --ks-key-alias "$MYKEY_ALIAS" \
            --key-pass "pass:$MYKEY_PASSWORD" \
            --out "$FINAL" \
            "$ALIGNED"

          # Verify
          echo "=== apksigner verify ==="
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose "$FINAL"

          echo "=== print cert ==="
          CERT_INFO=$("$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$FINAL")
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -qi "Android Debug"; then
            echo "ERROR: APK is signed with the debug certificate!"; exit 1
          fi
          echo "OK: APK is release-signed (not debug)."

      - name: Upload signed release APK
        if: github.event_name != 'pull_request' && secrets.MYKEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ShadowText-release-signed-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload unsigned APK (fallback when no signing secrets)
        if: github.event_name == 'pull_request' || secrets.MYKEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: ShadowText-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results*.html
          retention-days: 7
